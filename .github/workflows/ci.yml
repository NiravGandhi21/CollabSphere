name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: 20.19.0
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify no secret .env files are tracked
        run: |
          if git ls-files | grep -E '^\.env$|/\.env$' | grep -v '\.env\.example$'; then
            echo "::error::Found committed .env file in repository! Aborting build."
            exit 1
          else
            echo "✅ No sensitive .env files tracked in Git."
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Backend ------------------------------------------------------
      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run backend tests
        working-directory: ./backend
        env:
          NODE_ENV: test
        run: npm test

      # Frontend -----------------------------------------------------
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run frontend lint (if present)
        working-directory: ./frontend
        run: |
          if npm run | grep -q ' lint'; then npm run lint; else echo "No lint script defined in frontend/package.json"; fi

      - name: Build frontend production assets
        working-directory: ./frontend
        run: npm run build

      # Docker --------------------------------------------------------
      - name: Validate Docker Compose specification
        run: |
          docker compose config

      - name: Build full-stack Docker image
        run: |
          docker build -t collabsphere:latest .

      # Dependency audit ----------------------------------------------
      - name: Audit backend dependencies
        working-directory: ./backend
        run: npm audit --omit=dev --audit-level=high

      - name: Audit frontend dependencies
        working-directory: ./frontend
        run: npm audit --omit=dev --audit-level=high
